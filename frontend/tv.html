<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mídia Indoor - TV</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;

            display: flex;
            justify-content: center;
            align-items: center;

            background:
                radial-gradient(circle at top left, #1e40af 0%, transparent 35%),
                linear-gradient(135deg, #0f172a, #1e293b);
        }

        /* CONTAINER */

        .tv-container {
            width: 94vw;
            height: 90vh;

            display: flex;
            gap: 15px;
        }

        /* PAINEL ESQUERDO */

        .left-panel {
            width: 30%;

            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* PAINEL DIREITO */

        .right-panel {
            width: 70%;

            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* CAIXAS */

        .box {
            position: relative;

            background: #ffffff;

            border-radius: 14px;

            padding: 20px;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            text-align: center;

            overflow: hidden;

            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.20);
        }

        /* LINHA NO TOPO */

        .box::before {
            content: "";

            position: absolute;

            top: 0;
            left: 0;

            width: 100%;
            height: 4px;

            background: linear-gradient(
                90deg,
                #2563eb,
                #06b6d4
            );
        }

        /* TÍTULOS */

        .box-title {
            color: #334155;

            font-size: 1.6vw;

            font-weight: 800;

            text-transform: uppercase;

            letter-spacing: 1px;

            margin-bottom: 12px;
        }

        /* GUICHÊ */

        .local-box {
            height: 48%;
            flex: none;
        }

        .local-number {
            color: #2563eb;

            font-size: 7vw;

            font-weight: 900;

            line-height: 1;
        }

        .local-type {
            color: #64748b;

            font-size: 1.5vw;

            font-weight: 700;

            margin-top: 8px;

            text-transform: uppercase;
        }

        /* HISTÓRICO */

        .history-box {
            flex: 1;

            justify-content: flex-start;
            align-items: stretch;
        }

        .history-box .box-title {
            align-self: center;

            font-size: 1.3vw;

            margin-bottom: 15px;
        }

        #history-list {
            list-style: none;

            width: 100%;

            color: #334155;

            font-size: 1.1vw;

            font-weight: 700;

            text-align: left;
        }

        #history-list li {
            padding: 10px 12px;

            margin-bottom: 8px;

            border-radius: 8px;

            background: #f1f5f9;

            border-left: 4px solid #2563eb;
        }

        #history-list li:first-child {
            background: #dbeafe;

            color: #1d4ed8;

            border-left-color: #1d4ed8;
        }

        /* PACIENTE */

        .patient-box {
            flex: 1;

            min-height: 0;
        }

        .patient-box .box-title {
            color: #64748b;

            font-size: 2vw;

            margin-bottom: 20px;
        }

        .patient-name {
            color: #dc2626;

            font-size: 5.5vw;

            font-weight: 900;

            line-height: 1.05;

            max-width: 95%;

            word-break: break-word;

            text-shadow:
                0 3px 10px rgba(220, 38, 38, 0.15);
        }

        /* LOGO */

        .logo-box {
            flex: none;

            height: 100px;

            padding: 10px 20px;

            display: flex;
            flex-direction: row;

            justify-content: center;
            align-items: center;

            gap: 12px;
        }

        .logo {
            width: 55px;
            height: 55px;

            object-fit: contain;
        }

        .logo-text {
            color: #2563eb;

            font-size: 1.3vw;

            font-weight: 900;

            text-transform: uppercase;
        }

        /* ANIMAÇÃO */

        @keyframes flash {

            0% {
                transform: scale(1);

                box-shadow:
                    0 6px 18px rgba(0, 0, 0, 0.20);
            }

            25% {
                transform: scale(1.02);

                box-shadow:
                    0 0 0 7px rgba(37, 99, 235, 0.25),
                    0 12px 35px rgba(37, 99, 235, 0.45);
            }

            50% {
                transform: scale(1);
            }

            75% {
                transform: scale(1.02);

                box-shadow:
                    0 0 0 7px rgba(37, 99, 235, 0.25),
                    0 12px 35px rgba(37, 99, 235, 0.45);
            }

            100% {
                transform: scale(1);
            }
        }

        .flash {
            animation: flash 0.6s ease 3;
        }

        /* RESPONSIVO */

        @media (max-width: 900px) {

            .tv-container {
                width: 96vw;
                height: 94vh;

                gap: 10px;
            }

            .left-panel,
            .right-panel {
                gap: 10px;
            }

            .box {
                border-radius: 12px;

                padding: 12px;
            }

            .patient-name {
                font-size: 5vw;
            }

            .logo-box {
                height: 80px;
            }

            .logo {
                width: 45px;
                height: 45px;
            }

            .logo-text {
                font-size: 12px;
            }
        }
    </style>
</head>

<body>

    <div class="tv-container">

        <!-- PAINEL ESQUERDO -->

        <div class="left-panel">

            <!-- GUICHÊ -->

            <div class="box local-box">

                <div class="box-title" id="local-tipo">
                    GUICHÊ
                </div>

                <div class="local-number" id="local-numero">
                    --
                </div>

                <div class="local-type">
                    LOCAL DE ATENDIMENTO
                </div>

            </div>


            <!-- HISTÓRICO -->

            <div class="box history-box">

                <div class="box-title">
                    ÚLTIMAS CHAMADAS
                </div>

                <ul id="history-list"></ul>

            </div>

        </div>


        <!-- PAINEL DIREITO -->

        <div class="right-panel">

            <!-- PACIENTE -->

            <div class="box patient-box">

                <div class="box-title">
                    PACIENTE
                </div>

                <div class="patient-name" id="patient-name">
                    AGUARDANDO...
                </div>

            </div>


            <!-- LOGO -->

            <div class="box logo-box">

                <img
                    src="vaidarbom.png"
                    alt="Logo do Hospital"
                    class="logo"
                >

                <div class="logo-text">
                    Hospital Vai Dar Bom
                </div>

            </div>

        </div>

    </div>


    <script>

        let ultimoId = null;


        function atualizar() {

            fetch("/tv/chamada")

                .then(response => {

                    if (!response.ok) {
                        throw new Error("Erro HTTP: " + response.status);
                    }

                    return response.json();

                })

                .then(data => {

                    const chamada = data.chamada;
                    const historico = data.historico || [];


                    /* CHAMADA ATUAL */

                    if (chamada) {

                        document.getElementById("local-tipo").innerText =
                            chamada.localTipo || "GUICHÊ";


                        document.getElementById("local-numero").innerText =
                            chamada.localNumero || "--";


                        document.getElementById("patient-name").innerText =
                            chamada.paciente || "AGUARDANDO...";


                        /* NOVA CHAMADA */

                        if (chamada.id !== ultimoId) {

                            ultimoId = chamada.id;

                            const patientBox =
                                document.querySelector(".patient-box");


                            patientBox.classList.remove("flash");

                            void patientBox.offsetWidth;

                            patientBox.classList.add("flash");
                        }

                    }


                    /* HISTÓRICO */

                    const list =
                        document.getElementById("history-list");


                    list.innerHTML = "";


                    historico
                        .slice(0, 4)
                        .forEach(h => {

                            const li =
                                document.createElement("li");


                            const tipo =
                                h.localTipo
                                    ? h.localTipo.substring(0, 4).toUpperCase()
                                    : "GUIC";


                            li.innerText =
                                `${tipo}. ${h.localNumero || "--"} - ${h.paciente || "Paciente"}`;


                            list.appendChild(li);

                        });

                })

                .catch(error => {

                    console.log(
                        "Erro ao buscar chamada:",
                        error
                    );

                });

        }


        /* PRIMEIRA ATUALIZAÇÃO */

        atualizar();


        /* ATUALIZA A CADA 2 SEGUNDOS */

        setInterval(atualizar, 2000);

    </script>

</body>

</html>
