<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mídia Indoor - TV</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;

            display: flex;
            justify-content: center;
            align-items: center;

            background:
                radial-gradient(circle at top left, #1e40af 0%, transparent 35%),
                linear-gradient(135deg, #0f172a, #1e293b);
        }

        /* ==============================
           CONTAINER PRINCIPAL
        ============================== */

        .tv-container {
            width: 94vw;
            height: 90vh;

            display: flex;
            gap: 20px;
        }

        /* ==============================
           PAINEL ESQUERDO
        ============================== */

        .left-panel {
            width: 30%;

            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* ==============================
           PAINEL DIREITO
        ============================== */

        .right-panel {
            width: 70%;

            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* ==============================
           CAIXAS
        ============================== */

        .box {
            position: relative;

            background: #ffffff;

            border-radius: 22px;

            padding: 25px;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            text-align: center;

            overflow: hidden;

            box-shadow:
                0 10px 30px rgba(0, 0, 0, 0.25);
        }

        /* Linha azul no topo */

        .box::before {
            content: "";

            position: absolute;

            top: 0;
            left: 0;

            width: 100%;
            height: 6px;

            background: linear-gradient(
                90deg,
                #2563eb,
                #06b6d4
            );
        }

        /* ==============================
           TÍTULOS
        ============================== */

        .box-title {
            color: #334155;

            font-size: 1.8vw;

            font-weight: 800;

            text-transform: uppercase;

            letter-spacing: 1px;

            margin-bottom: 15px;
        }

        /* ==============================
           LOCAL / GUICHÊ
        ============================== */

        .local-box {
            flex: 1;
        }

        .local-number {
            color: #2563eb;

            font-size: 8vw;

            font-weight: 900;

            line-height: 1;
        }

        .local-type {
            color: #64748b;

            font-size: 1.7vw;

            font-weight: 700;

            margin-top: 10px;

            text-transform: uppercase;
        }

        /* ==============================
           HISTÓRICO
        ============================== */

        .history-box {
            flex: 1;

            justify-content: flex-start;
            align-items: stretch;
        }

        .history-box .box-title {
            align-self: center;

            font-size: 1.4vw;

            margin-bottom: 20px;
        }

        #history-list {
            list-style: none;

            width: 100%;

            color: #334155;

            font-size: 1.2vw;

            font-weight: 700;

            text-align: left;
        }

        #history-list li {
            padding: 12px 15px;

            margin-bottom: 10px;

            border-radius: 10px;

            background: #f1f5f9;

            border-left: 5px solid #2563eb;
        }

        #history-list li:first-child {
            background: #dbeafe;

            color: #1d4ed8;

            border-left-color: #1d4ed8;
        }

        /* ==============================
           ÁREA DO PACIENTE
        ============================== */

        .patient-box {
            flex: 3;

            min-height: 0;

            background: #ffffff;
        }

        .patient-box .box-title {
            color: #64748b;

            font-size: 2.2vw;

            margin-bottom: 25px;
        }

        .patient-name {
            color: #dc2626;

            font-size: 6vw;

            font-weight: 900;

            line-height: 1.05;

            max-width: 95%;

            word-break: break-word;

            text-shadow:
                0 4px 12px rgba(220, 38, 38, 0.15);
        }

        /* ==============================
           LOGO
        ============================== */

        .logo-box {
            flex: 1;
        }

        .logo-text {
            color: #2563eb;

            font-size: 2.5vw;

            font-weight: 900;

            text-transform: uppercase;
        }

        /* ==============================
           ANIMAÇÃO DA CHAMADA
        ============================== */

        @keyframes flash {

            0% {
                transform: scale(1);

                box-shadow:
                    0 10px 30px rgba(0, 0, 0, 0.25);
            }

            25% {
                transform: scale(1.02);

                box-shadow:
                    0 0 0 8px rgba(37, 99, 235, 0.25),
                    0 15px 45px rgba(37, 99, 235, 0.5);
            }

            50% {
                transform: scale(1);
            }

            75% {
                transform: scale(1.02);

                box-shadow:
                    0 0 0 8px rgba(37, 99, 235, 0.25),
                    0 15px 45px rgba(37, 99, 235, 0.5);
            }

            100% {
                transform: scale(1);
            }
        }

        .flash {
            animation: flash 0.6s ease 3;
        }

        /* ==============================
           RESPONSIVO
        ============================== */

        @media (max-width: 900px) {

            .tv-container {
                width: 96vw;
                height: 94vh;

                gap: 12px;
            }

            .left-panel,
            .right-panel {
                gap: 12px;
            }

            .box {
                border-radius: 16px;

                padding: 15px;
            }

            .patient-name {
                font-size: 5vw;
            }
        }
    </style>
</head>

<body>

    <div class="tv-container">

        <!-- =========================
             PAINEL ESQUERDO
        ========================== -->

        <div class="left-panel">

            <!-- LOCAL -->
            <div class="box local-box">

                <div class="box-title" id="local-tipo">
                    GUICHÊ
                </div>

                <div class="local-number" id="local-numero">
                    --
                </div>

                <div class="local-type">
                    LOCAL DE ATENDIMENTO
                </div>

            </div>


            <!-- HISTÓRICO -->
            <div class="box history-box">

                <div class="box-title">
                    ÚLTIMAS CHAMADAS
                </div>

                <ul id="history-list"></ul>

            </div>

        </div>


        <!-- =========================
             PAINEL DIREITO
        ========================== -->

        <div class="right-panel">

            <!-- PACIENTE -->
            <div class="box patient-box">

                <div class="box-title">
                    PACIENTE
                </div>

                <div class="patient-name" id="patient-name">
                    AGUARDANDO...
                </div>

            </div>


            <!-- LOGO -->
            <div class="box logo-box">

<div class="box logo-box">
    <img src="vaidarbom.png" alt="Logo do Hospital" class="logo">
    <div class="logo-text">Hospital vai dar bom</div>
</div>

<style>
.logo-box {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 8px 15px;
    height: 90px;
    background: #f5faff;
    border-radius: 10px;
    box-shadow: 0 2px 8px #0002;
}

.logo {
    width: 65px;
    height: 65px;
    object-fit: contain;
}

.logo-text {
    font: bold 18px Arial;
    color: #1769aa;
}
</style>

            </div>

        </div>

    </div>


    <script>

        let ultimoId = null;


        function atualizar() {

            fetch("/tv/chamada")

                .then(response => {

                    if (!response.ok) {
                        throw new Error("Erro HTTP: " + response.status);
                    }

                    return response.json();

                })

                .then(data => {

                    const chamada = data.chamada;
                    const historico = data.historico || [];


                    /* =========================
                       ATUALIZA CHAMADA ATUAL
                    ========================== */

                    if (chamada) {

                        document.getElementById("local-tipo").innerText =
                            chamada.localTipo || "GUICHÊ";


                        document.getElementById("local-numero").innerText =
                            chamada.localNumero || "--";


                        document.getElementById("patient-name").innerText =
                            chamada.paciente || "AGUARDANDO...";


                        /* =========================
                           NOVA CHAMADA
                        ========================== */

                        if (chamada.id !== ultimoId) {

                            ultimoId = chamada.id;

                            const patientBox =
                                document.querySelector(".patient-box");


                            patientBox.classList.remove("flash");


                            /* força o navegador a reiniciar a animação */

                            void patientBox.offsetWidth;


                            patientBox.classList.add("flash");
                        }

                    }


                    /* =========================
                       HISTÓRICO
                    ========================== */

                    const list =
                        document.getElementById("history-list");


                    list.innerHTML = "";


                    historico
                        .slice(0, 4)
                        .forEach(h => {

                            const li =
                                document.createElement("li");


                            const tipo =
                                h.localTipo
                                    ? h.localTipo.substring(0, 4).toUpperCase()
                                    : "GUIC";


                            li.innerText =
                                `${tipo}. ${h.localNumero || "--"} - ${h.paciente || "Paciente"}`;


                            list.appendChild(li);

                        });

                })

                .catch(error => {

                    console.log(
                        "Erro ao buscar chamada:",
                        error
                    );

                });

        }


        /* Primeira atualização */

        atualizar();


        /* Atualiza a cada 2 segundos */

        setInterval(atualizar, 2000);

    </script>

</body>

</html>
