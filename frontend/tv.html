<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mídia Indoor - TV</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        :root {
            --navy-950: #081521;
            --navy-900: #0d1f2d;
            --navy-800: #132b3a;

            --teal-700: #176b6b;
            --teal-600: #238080;
            --teal-500: #3b9b98;

            --gold-500: #c6a15b;
            --gold-400: #d8b978;

            --cream: #f8f7f3;
            --cream-dark: #eeece5;

            --text-dark: #172b3a;
            --text-muted: #71808a;

            --white: #ffffff;
        }


        /* =========================================================
           FUNDO
        ========================================================= */

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;

            display: flex;
            justify-content: center;
            align-items: center;

            background:
                radial-gradient(
                    circle at 8% 10%,
                    rgba(35, 128, 128, 0.18),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 92% 90%,
                    rgba(198, 161, 91, 0.08),
                    transparent 30%
                ),
                linear-gradient(
                    135deg,
                    #07141f 0%,
                    #0b1b28 48%,
                    #102635 100%
                );
        }


        /* =========================================================
           CONTAINER PRINCIPAL
        ========================================================= */

        .tv-container {
            width: 94vw;
            height: 90vh;

            display: flex;
            gap: 18px;
        }


        /* =========================================================
           PAINÉIS
        ========================================================= */

        .left-panel {
            width: 30%;

            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .right-panel {
            width: 70%;

            display: flex;
            flex-direction: column;
            gap: 18px;
        }


        /* =========================================================
           BASE DOS CARDS
        ========================================================= */

        .box {
            position: relative;

            border-radius: 18px;

            overflow: hidden;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            text-align: center;

            box-shadow:
                0 14px 35px rgba(0, 0, 0, 0.18),
                0 2px 8px rgba(0, 0, 0, 0.08);
        }


        /* Linha institucional discreta */

        .box::before {
            content: "";

            position: absolute;

            top: 0;
            left: 0;

            width: 100%;
            height: 3px;

            background:
                linear-gradient(
                    90deg,
                    var(--teal-700),
                    var(--teal-500),
                    var(--gold-400)
                );

            opacity: 0.9;
        }


        /* =========================================================
           TÍTULOS
        ========================================================= */

        .box-title {
            color: var(--text-dark);

            font-size: 1.35vw;

            font-weight: 700;

            text-transform: uppercase;

            letter-spacing: 2px;

            margin-bottom: 14px;
        }


        /* =========================================================
           GUICHÊ
        ========================================================= */

        .local-box {
            height: 48%;
            flex: none;

            padding: 24px;

            background:
                linear-gradient(
                    145deg,
                    #fbfaf7 0%,
                    #f2f0e9 100%
                );

            border: 1px solid rgba(255, 255, 255, 0.75);
        }


        .local-box .box-title {
            color: var(--navy-800);

            font-size: 1.45vw;

            letter-spacing: 2.5px;
        }


        .local-number {
            color: var(--teal-700);

            font-size: 7vw;

            font-weight: 800;

            line-height: 0.95;

            letter-spacing: -3px;

            text-shadow:
                0 5px 20px rgba(23, 107, 107, 0.12);
        }


        .local-type {
            color: var(--text-muted);

            font-size: 1.05vw;

            font-weight: 600;

            margin-top: 12px;

            text-transform: uppercase;

            letter-spacing: 1.8px;
        }


        /* Pequeno detalhe decorativo */

        .local-box::after {
            content: "";

            position: absolute;

            width: 110px;
            height: 110px;

            border-radius: 50%;

            right: -55px;
            bottom: -55px;

            border: 1px solid rgba(35, 128, 128, 0.12);
        }


        /* =========================================================
           HISTÓRICO
        ========================================================= */

        .history-box {
            flex: 1;

            justify-content: flex-start;
            align-items: stretch;

            padding: 24px;

            background:
                linear-gradient(
                    145deg,
                    #f8f7f3 0%,
                    #efeee8 100%
                );

            border: 1px solid rgba(255, 255, 255, 0.7);
        }


        .history-box .box-title {
            align-self: center;

            color: var(--navy-800);

            font-size: 1.05vw;

            letter-spacing: 2px;

            margin-bottom: 18px;
        }


        #history-list {
            list-style: none;

            width: 100%;

            color: var(--text-dark);

            font-size: 0.98vw;

            font-weight: 600;

            text-align: left;
        }


        #history-list li {
            position: relative;

            padding: 12px 14px 12px 18px;

            margin-bottom: 9px;

            border-radius: 9px;

            background: rgba(255, 255, 255, 0.72);

            border: 1px solid rgba(19, 43, 58, 0.06);

            box-shadow:
                0 3px 10px rgba(0, 0, 0, 0.04);

            color: #52616b;

            transition:
                background 0.2s ease,
                transform 0.2s ease;
        }


        #history-list li::before {
            content: "";

            position: absolute;

            left: 0;
            top: 9px;
            bottom: 9px;

            width: 3px;

            border-radius: 3px;

            background: var(--teal-600);
        }


        #history-list li:first-child {
            background:
                linear-gradient(
                    90deg,
                    rgba(35, 128, 128, 0.10),
                    rgba(255, 255, 255, 0.85)
                );

            color: var(--navy-800);

            font-weight: 700;
        }


        #history-list li:first-child::before {
            background: var(--gold-500);
        }


        /* =========================================================
           PACIENTE
        ========================================================= */

        .patient-box {
            flex: 1;

            min-height: 0;

            padding: 30px;

            background:
                radial-gradient(
                    circle at 88% 15%,
                    rgba(59, 155, 152, 0.13),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 15% 90%,
                    rgba(198, 161, 91, 0.06),
                    transparent 28%
                ),
                linear-gradient(
                    145deg,
                    #0d202e 0%,
                    #102a39 55%,
                    #0c1c29 100%
                );

            border:
                1px solid rgba(255, 255, 255, 0.06);

            box-shadow:
                0 18px 45px rgba(0, 0, 0, 0.30);
        }


        .patient-box::before {
            height: 3px;

            background:
                linear-gradient(
                    90deg,
                    var(--teal-600),
                    var(--teal-500),
                    var(--gold-400)
                );
        }


        .patient-box::after {
            content: "";

            position: absolute;

            width: 300px;
            height: 300px;

            border-radius: 50%;

            right: -160px;
            bottom: -180px;

            border:
                1px solid rgba(255, 255, 255, 0.045);
        }


        .patient-box .box-title {
            color: rgba(255, 255, 255, 0.58);

            font-size: 1.35vw;

            letter-spacing: 3px;

            margin-bottom: 22px;
        }


        .patient-name {
            position: relative;
            z-index: 2;

            color: var(--gold-400);

            font-size: 5.3vw;

            font-weight: 800;

            line-height: 1.05;

            max-width: 95%;

            word-break: break-word;

            letter-spacing: -1.5px;

            text-shadow:
                0 5px 25px rgba(0, 0, 0, 0.25);
        }


        /* =========================================================
           LOGO / RODAPÉ
        ========================================================= */

        .logo-box {
            flex: none;

            height: 76px;

            padding: 10px 25px;

            display: flex;
            flex-direction: row;

            justify-content: center;
            align-items: center;

            gap: 12px;

            background:
                rgba(248, 247, 243, 0.97);

            border:
                1px solid rgba(255, 255, 255, 0.7);

            box-shadow:
                0 8px 22px rgba(0, 0, 0, 0.14);
        }


        .logo {
            width: 42px;
            height: 42px;

            object-fit: contain;
        }


        .logo-text {
            color: var(--navy-800);

            font-size: 1.05vw;

            font-weight: 800;

            text-transform: uppercase;

            letter-spacing: 1.6px;
        }


        /* Pequeno ponto de destaque */

        .logo-text::before {
            content: "";

            display: inline-block;

            width: 6px;
            height: 6px;

            margin-right: 10px;

            border-radius: 50%;

            background: var(--teal-600);

            vertical-align: middle;
        }


        /* =========================================================
           ANIMAÇÃO DE NOVA CHAMADA
        ========================================================= */

        @keyframes flash {

            0% {
                transform: scale(1);

                box-shadow:
                    0 18px 45px rgba(0, 0, 0, 0.30);
            }

            20% {
                transform: scale(1.008);

                box-shadow:
                    0 0 0 5px rgba(59, 155, 152, 0.16),
                    0 0 35px rgba(59, 155, 152, 0.30),
                    0 22px 55px rgba(0, 0, 0, 0.34);
            }

            40% {
                transform: scale(1);
            }

            60% {
                transform: scale(1.008);

                box-shadow:
                    0 0 0 5px rgba(198, 161, 91, 0.13),
                    0 0 35px rgba(198, 161, 91, 0.24),
                    0 22px 55px rgba(0, 0, 0, 0.34);
            }

            100% {
                transform: scale(1);

                box-shadow:
                    0 18px 45px rgba(0, 0, 0, 0.30);
            }
        }


        .flash {
            animation: flash 0.7s ease 3;
        }


        /* =========================================================
           RESPONSIVO
        ========================================================= */

        @media (max-width: 900px) {

            .tv-container {
                width: 96vw;
                height: 94vh;

                gap: 10px;
            }


            .left-panel,
            .right-panel {
                gap: 10px;
            }


            .box {
                border-radius: 13px;

                padding: 14px;
            }


            .patient-name {
                font-size: 5vw;
            }


            .patient-box .box-title {
                font-size: 1.8vw;
            }


            .local-number {
                font-size: 7vw;
            }


            .logo-box {
                height: 68px;
            }


            .logo {
                width: 38px;
                height: 38px;
            }


            .logo-text {
                font-size: 12px;
            }
        }
    </style>
</head>

<body>

    <div class="tv-container">

        <!-- PAINEL ESQUERDO -->

        <div class="left-panel">

            <!-- GUICHÊ -->

            <div class="box local-box">

                <div class="box-title" id="local-tipo">
                    GUICHÊ
                </div>

                <div class="local-number" id="local-numero">
                    --
                </div>

                <div class="local-type">
                    LOCAL DE ATENDIMENTO
                </div>

            </div>


            <!-- HISTÓRICO -->

            <div class="box history-box">

                <div class="box-title">
                    ÚLTIMAS CHAMADAS
                </div>

                <ul id="history-list"></ul>

            </div>

        </div>


        <!-- PAINEL DIREITO -->

        <div class="right-panel">

            <!-- PACIENTE -->

            <div class="box patient-box">

                <div class="box-title">
                    PACIENTE
                </div>

                <div class="patient-name" id="patient-name">
                    AGUARDANDO...
                </div>

            </div>


            <!-- LOGO -->

            <div class="box logo-box">

                <img
                    src="vaidarbom.png"
                    alt="Logo do Hospital"
                    class="logo"
                >

                <div class="logo-text">
                    Hospital Vai Dar Bom
                </div>

            </div>

        </div>

    </div>


    <script>

        let ultimoId = null;


        function atualizar() {

            fetch("/tv/chamada")

                .then(response => {

                    if (!response.ok) {
                        throw new Error("Erro HTTP: " + response.status);
                    }

                    return response.json();

                })

                .then(data => {

                    const chamada = data.chamada;
                    const historico = data.historico || [];


                    /* CHAMADA ATUAL */

                    if (chamada) {

                        document.getElementById("local-tipo").innerText =
                            chamada.localTipo || "GUICHÊ";


                        document.getElementById("local-numero").innerText =
                            chamada.localNumero || "--";


                        document.getElementById("patient-name").innerText =
                            chamada.paciente || "AGUARDANDO...";


                        /* NOVA CHAMADA */

                        if (chamada.id !== ultimoId) {

                            ultimoId = chamada.id;

                            const patientBox =
                                document.querySelector(".patient-box");


                            patientBox.classList.remove("flash");

                            void patientBox.offsetWidth;

                            patientBox.classList.add("flash");
                        }

                    }


                    /* HISTÓRICO */

                    const list =
                        document.getElementById("history-list");


                    list.innerHTML = "";


                    historico
                        .slice(0, 4)
                        .forEach(h => {

                            const li =
                                document.createElement("li");


                            const tipo =
                                h.localTipo
                                    ? h.localTipo.substring(0, 4).toUpperCase()
                                    : "GUIC";


                            li.innerText =
                                `${tipo}. ${h.localNumero || "--"} - ${h.paciente || "Paciente"}`;


                            list.appendChild(li);

                        });

                })

                .catch(error => {

                    console.log(
                        "Erro ao buscar chamada:",
                        error
                    );

                });

        }


        /* PRIMEIRA ATUALIZAÇÃO */

        atualizar();


        /* ATUALIZA A CADA 2 SEGUNDOS */

        setInterval(atualizar, 2000);

    </script>

</body>

</html>
